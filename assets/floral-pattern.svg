<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="240" height="240" viewBox="0 0 240 240">
  <!-- Patrón floral inspirado en el papel pintado del salón: verde azulado, dorado y flores claras -->
  <defs>
    <path id="leaf" d="M0 0C9-11 27-12 38 0C27 12 9 11 0 0Z"/>
    <g id="flower">
      <g fill="#dcc28d">
        <ellipse rx="8" ry="15" cy="-14"/>
        <ellipse rx="8" ry="15" cy="-14" transform="rotate(72)"/>
        <ellipse rx="8" ry="15" cy="-14" transform="rotate(144)"/>
        <ellipse rx="8" ry="15" cy="-14" transform="rotate(216)"/>
        <ellipse rx="8" ry="15" cy="-14" transform="rotate(288)"/>
      </g>
      <g fill="#f3e6c4" opacity=".55">
        <ellipse rx="3" ry="9" cy="-12"/>
        <ellipse rx="3" ry="9" cy="-12" transform="rotate(72)"/>
        <ellipse rx="3" ry="9" cy="-12" transform="rotate(144)"/>
        <ellipse rx="3" ry="9" cy="-12" transform="rotate(216)"/>
        <ellipse rx="3" ry="9" cy="-12" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#b48a43"/>
      <circle r="2.5" fill="#f3e6c4"/>
    </g>
    <g id="bloom">
      <g fill="#8fc1b9">
        <circle r="6" cy="-7"/>
        <circle r="6" cy="-7" transform="rotate(90)"/>
        <circle r="6" cy="-7" transform="rotate(180)"/>
        <circle r="6" cy="-7" transform="rotate(270)"/>
      </g>
      <circle r="3.5" fill="#dcc28d"/>
    </g>
    <g id="sprig">
      <path d="M0 0C10-14 22-22 36-26" fill="none" stroke="#3c7f7b" stroke-width="1.6" stroke-linecap="round"/>
      <use href="#leaf" xlink:href="#leaf" fill="#2f716e" transform="translate(10 -9) rotate(-80) scale(.45)"/>
      <use href="#leaf" xlink:href="#leaf" fill="#3c7f7b" transform="translate(20 -17) rotate(10) scale(.45)"/>
      <use href="#leaf" xlink:href="#leaf" fill="#2f716e" transform="translate(28 -22) rotate(-70) scale(.4)"/>
    </g>
  </defs>

  <rect width="240" height="240" fill="#123d3f"/>

  <!-- Hojas grandes -->
  <g fill="#1f5a5b">
    <use href="#leaf" xlink:href="#leaf" transform="translate(60 60) rotate(-35) scale(1.5)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(60 60) rotate(145) scale(1.4)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(180 180) rotate(30) scale(1.5)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(180 180) rotate(210) scale(1.4)"/>
  </g>
  <g fill="#2a6866">
    <use href="#leaf" xlink:href="#leaf" transform="translate(60 60) rotate(60) scale(1.1)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(180 180) rotate(-120) scale(1.1)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(-4 176) rotate(-20) scale(.9)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(236 176) rotate(-20) scale(.9)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(120 -6) rotate(100) scale(.9)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(120 234) rotate(100) scale(.9)"/>
  </g>

  <!-- Ramitas -->
  <use href="#sprig" xlink:href="#sprig" transform="translate(132 112)"/>
  <use href="#sprig" xlink:href="#sprig" transform="translate(100 140) rotate(180)"/>
  <use href="#sprig" xlink:href="#sprig" transform="translate(8 96) rotate(-40)"/>
  <use href="#sprig" xlink:href="#sprig" transform="translate(232 24) rotate(140)"/>

  <!-- Flores doradas -->
  <use href="#flower" xlink:href="#flower" transform="translate(60 60) rotate(10)"/>
  <use href="#flower" xlink:href="#flower" transform="translate(180 180) rotate(-14) scale(.9)"/>
  <!-- Flores claras pequeñas -->
  <use href="#bloom" xlink:href="#bloom" transform="translate(180 54) rotate(20)"/>
  <use href="#bloom" xlink:href="#bloom" transform="translate(56 178) rotate(-15) scale(.85)"/>
  <use href="#bloom" xlink:href="#bloom" transform="translate(0 0) scale(.7)"/>
  <use href="#bloom" xlink:href="#bloom" transform="translate(240 0) scale(.7)"/>
  <use href="#bloom" xlink:href="#bloom" transform="translate(0 240) scale(.7)"/>
  <use href="#bloom" xlink:href="#bloom" transform="translate(240 240) scale(.7)"/>

  <!-- Puntos dorados -->
  <g fill="#c9a764">
    <circle cx="118" cy="62" r="2.2"/>
    <circle cx="128" cy="74" r="1.5"/>
    <circle cx="20" cy="128" r="2"/>
    <circle cx="214" cy="118" r="2.2"/>
    <circle cx="150" cy="212" r="1.6"/>
    <circle cx="96" cy="226" r="2"/>
    <circle cx="90" cy="10" r="1.6"/>
  </g>
</svg>
